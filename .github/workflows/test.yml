name: Tests

# Cada subida a main y cada pull request: lint, tipos, tests de lib/ y una selección corta de la interfaz.
# La matriz completa (24 dispositivos × motores reales) solo corre al pulsarla a mano: Actions → Tests → «Run workflow».
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una subida nueva a la misma rama cancela las pruebas de la anterior, que ya no importan
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tipos y tests de lib/
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  interfaz-rapida:
    name: Interfaz (selección) · ${{ matrix.nombre }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false # que un navegador falle no oculta el resultado de los demás
      matrix:
        include:
          # Los tres motores en escritorio, más lo más estrecho (iPhone SE en horizontal), una tableta y un plegable abierto
          - nombre: chromium
            engine: chromium
            proyectos: --project=chromium-escritorio --project=chromium-fold-6-abierto-vertical
          - nombre: webkit
            engine: webkit
            proyectos: --project=webkit-escritorio --project=webkit-iphone-se-horizontal --project=webkit-ipad-mini-vertical
          - nombre: firefox
            engine: firefox
            proyectos: --project=firefox-escritorio
    env:
      PW_BROWSER: '' # usa el Chromium de Playwright, no el Brave de local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npx playwright test ${{ matrix.proyectos }}
      # Con fallos, el informe incluye capturas y trazas para ver qué pasó en el navegador
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: informe-rapida-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  interfaz-completa:
    name: Interfaz (completa) · ${{ matrix.nombre }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chromium cubre Android, plegables y escritorio; WebKit, iPhone/iPad y Safari de escritorio; Firefox, escritorio.
          # Chromium va partido en dos porque tiene unos 650 tests.
          - { nombre: chromium 1/2, engine: chromium, shard: 1/2 }
          - { nombre: chromium 2/2, engine: chromium, shard: 2/2 }
          - { nombre: webkit, engine: webkit, shard: 1/1 }
          - { nombre: firefox, engine: firefox, shard: 1/1 }
    env:
      PW_BROWSER: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npx playwright test --project='${{ matrix.engine }}-*' --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: informe-completa-${{ matrix.engine }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
